[PHP]
display_errors = Off
max_execution_time = 10000
max_input_time = 5000
max_input_vars = 5000
memory_limit = 4048M
post_max_size = 4024M
session.gc_maxlifetime = 4440
session.save_path = "/var/cpanel/php/sessions/alt-php73"
upload_max_filesize = 128M
zlib.output_compression = On
error_log = "error_log"
log_errors = On
